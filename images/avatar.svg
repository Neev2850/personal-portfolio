  <!-- Hair -->
  <path d="M52 62 C50 40, 60 28, 80 28 C100 28, 110 40, 108 62 C104 46, 96 38, 80 38 C64 38, 56 46, 52 62 Z" fill="#1e293b" />
  <path d="M52 56 C52 44, 60 36, 75 34 C64 38, 56 46, 54 58 Z" fill="#334155" />

  <!-- Eyeglasses -->
  <rect x="58" y="60" width="18" height="13" rx="4" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <rect x="84" y="60" width="18" height="13" rx="4" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <line x1="76" y1="66" x2="84" y2="66" stroke="#0f172a" stroke-width="2.5" />

  <!-- Eyes behind glasses -->
